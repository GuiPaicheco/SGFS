name: Publicar versão SGFS
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "SGFS ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
